<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plantilla de presentación</title>
  <style>
    body{font-family:system-ui,"Segoe UI",Arial,sans-serif;color:#fff;background:#10232a}
    .slide{padding:6vh 8vw;background:linear-gradient(135deg,#10232a,#0f766e)}
    .slide h1{font-size:clamp(2.4rem,6vw,5.5rem);margin:0 0 2vh;line-height:1.05}
    .slide h2{font-size:clamp(1.8rem,4vw,3.4rem);margin:0 0 3vh}
    .slide p,.slide li{font-size:clamp(1.2rem,2.4vw,2.2rem);line-height:1.5;max-width:60ch}
    .slide ul{padding-left:1.2em}
    .slide button{font:inherit;font-size:1.4rem;padding:.5em 1em;border:0;border-radius:8px;background:#e4572e;color:#fff;cursor:pointer}
  </style>
</head>
<body>

  <!-- DIAPOSITIVA 1: portada -->
  <section class="slide">
    <h1>Título de la presentación</h1>
    <p>Grupo 1 · Integrantes: Nombre 1, Nombre 2, Nombre 3</p>
  </section>

  <!-- DIAPOSITIVA 2: contenido -->
  <section class="slide">
    <h2>Idea principal</h2>
    <ul>
      <li>Primer punto importante</li>
      <li>Segundo punto importante</li>
      <li>Tercer punto importante</li>
    </ul>
  </section>

  <!-- DIAPOSITIVA 3: ejemplo con JavaScript -->
  <section class="slide">
    <h2>También funciona JavaScript</h2>
    <p><button id="boton" type="button">Pulsa aquí</button></p>
    <p id="resultado">Pulsaciones: 0</p>
  </section>

  <!-- DIAPOSITIVA 4: cierre -->
  <section class="slide">
    <h2>Conclusión</h2>
    <p>Resume en una frase lo más importante. ¡Gracias!</p>
  </section>

  <script src="../js/diapositivas.js"></script>
  <script>
    var veces = 0;
    document.getElementById("boton").addEventListener("click", function () {
      veces++;
      document.getElementById("resultado").textContent = "Pulsaciones: " + veces;
    });
  </script>
</body>
</html>
